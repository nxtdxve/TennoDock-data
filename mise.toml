# Werkzeuge für das Daten-Repo (#227, wie im App-Repo TennoDock). Einrichten pro Klon: mise install, dann hk install --mise.
[tools]
# hk und gitleaks mit fester Version, mindestens 7 Tage alt; von Hand nachführen, gleich wie im App-Repo.
# Git-Hooks (hk.pkl). Die Version immer zusammen mit den URLs in hk.pkl ändern.
hk = "2.11.1"
# Secret-Scan (.gitleaks.toml), im Hook und im Workflow secrets.yml.
gitleaks = "8.30.1"

[tasks.secrets]
description = "Secret-Scan über die ganze Historie (wie der Workflow secrets.yml)"
run = "gitleaks git --redact --no-banner --log-level warn ."
