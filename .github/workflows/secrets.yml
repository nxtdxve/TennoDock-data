name: Secrets

# gitleaks prüft das öffentliche Daten-Repo auf Secrets und Spielstand-Felder (#227, wie TennoDock #222). Regeln in
# .gitleaks.toml, Version in mise.toml. Die ganze Historie ist klein (wenige MB, wenige Sekunden), darum immer ganz.
# Commits der Daten-Jobs kommen mit dem GITHUB_TOKEN und lösen kein `push` aus; dafür läuft der Scan nach jedem dieser
# Jobs (`workflow_run`) und einmal am Tag als Netz.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Assets, Glyph codes, KIM, Polarities, Prices, Promo codes, Public export, Rivens, Sources]
    types: [completed]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Bei workflow_run den neuesten Stand von main prüfen, nicht den Commit, mit dem der Daten-Job begann.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: gitleaks
          minimum_release_age: 7d
      - name: Scan the whole history
        run: gitleaks git --redact --verbose --no-banner .
