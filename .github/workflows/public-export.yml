# Teile des DE Public Export für TennoDock (#179 Stufe 2, Daves Entscheidung vom 08.11.2026): liest alle 30 min den Index
# (en, de, je rund 0,5 KB) und baut nur die Teile neu, deren Datei DE geändert hat. TennoDock lädt sie statt der rund 15 MB
# Rohdateien pro DE-Änderung und prüft jeden per SHA-256; hinkt dieses Repo länger als 6 h hinterher, lädt die App selbst von
# DE. Ein Commit nur, wenn sich ein Teil geändert hat. `xz` (Index entpacken) bringt das Ubuntu-Image mit, keine npm-Abhängigkeit.
# Im TennoDock-Repo liegt dieser Ordner unter `tools/tennodock-data/` (1:1 der Inhalt des Daten-Repos) und läuft dort nicht.
# Doku: docs/pakete/179-loading.md im App-Repo.
name: Public export

on:
  schedule:
    # Alle 30 min. GitHub legt geplante Läufe oft Stunden zu spät an (siehe prices.yml); bei so vielen Zeitpunkten kommt
    # trotzdem regelmässig einer dran, und jeder baut mit dem Index, der dann gilt.
    - cron: '7,37 * * * *'
  # Von Hand: Actions › Public export › Run workflow, oder `gh workflow run public-export.yml -R nxtdxve/TennoDock-data`.
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build all parts again (for example after a new derive.mjs)
        type: boolean
        default: false
  # Eine Änderung am Skript gilt sofort. Commits des Workflows selbst (GITHUB_TOKEN) lösen keinen neuen Lauf aus.
  push:
    branches: [main]
    paths:
      - 'public-export-file/**'
      - '.github/workflows/public-export.yml'

permissions:
  contents: write # Dateien committen

concurrency:
  group: public-export
  cancel-in-progress: false

jobs:
  public-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test
        run: node --test "public-export-file/**/*.test.mjs"
      - name: Build
        id: build
        env:
          REBUILD: ${{ inputs.rebuild && '1' || '' }}
        run: node public-export-file/build.mjs
      - name: Commit
        # Werte aus dem Lauf nur über die Umgebung, nie als Ausdruck direkt im Befehl (Script-Injection). Das Skript prüft sie
        # zusätzlich streng (`outputLines`: Hex, ganze Zahlen).
        env:
          INDEX: ${{ steps.build.outputs.index }}
          UPDATED: ${{ steps.build.outputs.updated }}
          PARTS: ${{ steps.build.outputs.parts }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Vor dem ersten erfolgreichen Lauf (Index fehlt) gibt es den Ordner noch nicht.
          if [ ! -d public-export ]; then echo 'Nothing yet'; exit 0; fi
          git add public-export
          if git diff --cached --quiet; then echo 'Nothing new'; exit 0; fi
          git commit -m "Public export $INDEX ($UPDATED of $PARTS parts new)"
          # Läuft ein anderer Workflow gerade auch, einmal auf den neuen Stand setzen und erneut versuchen.
          git push || { git pull --rebase origin main && git push; }
      # Fehlt der Index oder eine Datei, hält das die übrigen nicht auf, und die App lädt nach 6 h selbst von DE. Darum sonst
      # nur eine Warnung; nur der Lauf um 06 UTC schlägt fehl (`alert`), also höchstens ein, zwei Mails am Tag.
      - name: Report problems
        if: ${{ !cancelled() && (steps.build.outputs.failed != '0' || steps.build.outputs.index_failed == 'true') }}
        env:
          ALERT: ${{ steps.build.outputs.alert }}
        run: |
          echo '::warning::Public export index or some files could not be loaded, see the warnings of the build step'
          if [ "$ALERT" = 'true' ]; then echo '::error::Still failing at the daily check'; exit 1; fi
