# Fundorte für TennoDock (#164): baut `sources/v1/collectibles.json`, `items.json` und `missing.json` aus dem WARFRAME Wiki
# (ein Abruf aller Seiten über die MediaWiki-API pro Lauf), dem DE-Export und public-export-plus, einmal pro Woche. Ein
# Commit nur, wenn sich etwas geändert hat. Optional am ersten Lauf eines Monats ein Issue mit neuen Items ohne Fundort.
# Im TennoDock-Repo liegt dieser Ordner unter `tools/tennodock-data/` (1:1 der Inhalt des Daten-Repos) und läuft dort nicht.
# Doku: docs/pakete/164-sources.md im App-Repo. Lizenz der Wiki-Daten: CC BY-NC-SA 3.0 (README, „Item sources“).
name: Sources

on:
  schedule:
    # Dienstags, abseits der anderen Läufe (Preise 04:17/10:17, KIM 05:43, Glyph-Codes montags 06:29, Promo-Codes :11).
    - cron: '37 6 * * 2'
  # Von Hand: Actions › Sources › Run workflow, oder `gh workflow run sources.yml -R nxtdxve/TennoDock-data`.
  workflow_dispatch:
  # Eine Änderung am Skript gilt sofort. Commits des Workflows selbst (GITHUB_TOKEN) lösen keinen neuen Lauf aus.
  push:
    branches: [main]
    paths:
      - 'sources-file/**'
      - 'promo-codes-file/lib/**'
      - '.github/workflows/sources.yml'

env:
  # Schalter für den Abruf beim Wiki: 'on' oder 'off'. Mit 'off' fragt die Action das Wiki nicht mehr ab (z. B. ohne
  # Zustimmung von Weird Gloop); collectibles.json und items.json bleiben dann stehen, missing.json läuft weiter.
  SOURCES_WIKI: 'on'
  # Issue am ersten Lauf eines Monats mit Items, die seit dem Vormonat ohne Fundort sind: 'on' oder 'off'.
  SOURCES_ISSUE: 'off'

permissions:
  contents: write # Dateien committen
  issues: write # nur mit SOURCES_ISSUE=on

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test
        run: node --test "sources-file/**/*.test.mjs"
      - name: Report window
        id: window
        # Erster Lauf eines Monats (Tag 1 bis 7): Stichtag ist der erste Tag des Vormonats.
        run: |
          if [ "$SOURCES_ISSUE" = 'on' ] && [ "$(date -u +%d)" -le 7 ]; then
            echo "from=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        id: build
        env:
          REPORT_FROM: ${{ steps.window.outputs.from }}
          REPORT_FILE: ${{ runner.temp }}/sources-report.md
        run: node sources-file/build.mjs
      - name: Commit
        # Werte aus dem Lauf nur über die Umgebung, nie als Ausdruck direkt im Befehl (Script-Injection); das Skript prüft
        # sie zusätzlich streng (`outputLines`: Tag, ganze Zahlen).
        env:
          AS_OF: ${{ steps.build.outputs.asOf }}
          PLACES: ${{ steps.build.outputs.places }}
          ITEMS: ${{ steps.build.outputs.items }}
          MISSING: ${{ steps.build.outputs.missing }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources
          if git diff --cached --quiet; then echo 'Nothing new'; exit 0; fi
          git commit -m "Sources $AS_OF ($PLACES places, $ITEMS item sources, $MISSING missing)"
          # Läuft ein anderer Workflow gerade auch, einmal auf den neuen Stand setzen und erneut versuchen.
          git push || { git pull --rebase origin main && git push; }
      - name: Monthly issue
        if: ${{ env.SOURCES_ISSUE == 'on' && steps.window.outputs.from != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/sources-report.md
          FROM: ${{ steps.window.outputs.from }}
        run: |
          if [ -s "$REPORT_FILE" ]; then
            gh issue create --title "Items without a source since $FROM" --body-file "$REPORT_FILE" --label sources || gh issue create --title "Items without a source since $FROM" --body-file "$REPORT_FILE"
          else
            echo 'No new items without a source'
          fi
